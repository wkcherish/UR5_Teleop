[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quest-ur5"
version = "0.1.0"
description = "Standalone Quest 3 to UR5 teleoperation host"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
robot = ["ur-rtde==1.6.2"]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
quest-ur5 = "quest_ur5.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
